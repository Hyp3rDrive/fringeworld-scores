name: Mirror itch.io comments

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may run scheduled jobs a few minutes late under load
  workflow_dispatch:          # "Run workflow" button for an immediate refresh

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch comments
        run: python3 scrape.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain posts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "Update posts.json"
            git push
          fi
